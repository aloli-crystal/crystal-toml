name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.19.1"

      - name: Install dependencies
        run: shards install

      - name: Check formatting
        run: crystal tool format --check src/ spec/

      - name: Run tests
        run: crystal spec

      - name: Run linter
        run: bin/ameba

      - name: Build toml-test decoder binary
        run: shards build toml-decoder

      - name: Download toml-test
        run: |
          curl -L -o /tmp/toml-test.gz \
            https://github.com/toml-lang/toml-test/releases/download/v2.1.0/toml-test-v2.1.0-linux-amd64.gz
          gunzip /tmp/toml-test.gz
          chmod +x /tmp/toml-test
          /tmp/toml-test version

      - name: Run toml-test interop suite
        run: /tmp/toml-test test -decoder ./bin/toml-decoder
